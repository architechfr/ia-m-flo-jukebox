name: Nouvelles chansons YouTube

on:
  schedule:
    - cron: '17 */3 * * *'   # toutes les 3 heures
  workflow_dispatch:          # bouton « Run workflow » pour lancer tout de suite

permissions:
  contents: write

concurrency:
  group: sync-youtube
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lire la chaîne YouTube et mettre à jour le catalogue
        run: node scripts/sync-youtube.mjs
      - name: Publier s'il y a du nouveau
        run: |
          if git diff --quiet; then echo "Aucun changement."; exit 0; fi
          git config user.name "jukebox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json releases.js scripts/sorties-ignorees.json 2>/dev/null || git add catalogue.json releases.js
          git commit -m "Jukebox : nouvelles chansons depuis YouTube"
          git push
